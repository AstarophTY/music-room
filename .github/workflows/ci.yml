name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build et tests
        run: ./gradlew build --no-daemon

      - name: Build de l'image serveur
        run: docker build -f server/Dockerfile -t music-room-server .
