openapi: 3.0.3
info:
  title: Music Room API
  version: 0.1.0
  description: API REST + WebSocket du projet Music Room.
servers:
  - url: http://localhost:8080
tags:
  - name: system
  - name: users
paths:
  /health:
    get:
      tags: [system]
      summary: État du serveur et de la base
      responses:
        "200":
          description: Serveur et base OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Base de données injoignable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /api/v1/info:
    get:
      tags: [system]
      summary: Nom et version de l'API
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfoResponse" }
  /api/v1/users/me:
    get:
      tags: [users]
      summary: Authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XPlatform:
      in: header
      name: X-Platform
      schema: { type: string, example: android }
    XDevice:
      in: header
      name: X-Device
      schema: { type: string, example: Pixel 8 }
    XAppVersion:
      in: header
      name: X-App-Version
      schema: { type: string, example: 0.1.0 }
  schemas:
    HealthResponse:
      type: object
      required: [status, database]
      properties:
        status: { type: string, example: ok }
        database: { type: string, example: up }
    InfoResponse:
      type: object
      required: [name, version]
      properties:
        name: { type: string, example: music-room }
        version: { type: string, example: 0.1.0 }
    UserResponse:
      type: object
      required: [id, email, displayName, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        emailVerified: { type: boolean }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
