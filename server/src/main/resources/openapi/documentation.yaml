openapi: 3.0.3
info:
  title: Music Room API
  version: 0.1.0
  description: API REST + WebSocket du projet Music Room.
servers:
  - url: http://localhost:8080
tags:
  - name: system
  - name: auth
  - name: users
  - name: social
    description: Friends, one-to-one chat between friends, notifications.
  - name: events
    description: >-
      Music Track Vote. An event is a room where people propose songs and vote; the most voted song plays next on the
      owner's Spotify (only the owner streams: the others need no Spotify account). Changes are pushed live on
      GET /api/v1/events/{id}/ws.
paths:
  /health:
    get:
      tags: [system]
      summary: État du serveur et de la base
      responses:
        "200":
          description: Serveur et base OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Base de données injoignable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /api/v1/info:
    get:
      tags: [system]
      summary: Nom et version de l'API
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfoResponse" }
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Create an account (email + password, hashed with bcrypt)
      description: >-
        The terms of use must be accepted. A 6-digit code is emailed to the user;
        the account stays unverified (emailVerified = false) until it is sent to /api/v1/auth/email/verify.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created, the user is logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: Invalid email, password or display name, or terms not accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Email already used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in with email + password
      description: >-
        With 2FA on, answers 202 with a challenge; send it with a code to /api/v1/auth/2fa/verify.
        With email 2FA (method = email), the code is emailed at the same time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "202":
          description: Password right, the account has 2FA
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorChallengeResponse" }
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/oauth:
    post:
      tags: [auth]
      summary: Sign in or sign up with Google or Apple
      description: >-
        The app gets an ID token from the provider's SDK and sends it here. The server checks its signature
        (provider's public keys), issuer, audience (GOOGLE_CLIENT_ID / APPLE_CLIENT_ID) and expiry.
        An identity already linked logs in. Otherwise, an account with the same email is linked
        (if that account never verified its email, its password is removed and its sessions are revoked).
        Otherwise a new account is created, which requires acceptedTerms = true.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthLoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: Provider not configured on the server, or no verified email in the token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid or expired ID token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: "New account: the terms of use must be accepted (error = terms_required)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The account is already linked to another identity from this provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/email/verify:
    post:
      tags: [auth]
      summary: Verify the email with the 6-digit code sent by email
      description: A code works once, expires after 15 minutes and allows 5 tries.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400":
          description: Wrong, expired or locked code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/email/resend:
    post:
      tags: [auth]
      summary: Email a new verification code (the previous one stops working)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Code sent
        "400":
          description: Email already verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: A code was sent less than a minute ago
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The email could not be sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for new tokens (single use, rotated)
      description: Reusing an already used refresh token revokes every session of the user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Invalid, expired or revoked refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "204":
          description: Logged out
  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: Change the password (signs out every other session and emails a security alert)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: Password changed, new tokens for this device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: New password too weak
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Current password is incorrect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      summary: Email a password reset code
      description: >-
        Always answers 204, whether an account uses this email or not (no account enumeration).
        At most one email per minute. The email is written in the Accept-Language language (en, fr).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "204":
          description: Done (a code was sent if the account exists)
  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      summary: Set a new password with the emailed code
      description: >-
        The code works once, expires after 15 minutes and allows 5 tries. Signs out every other session,
        marks the email as verified, emails a security alert, and logs in on this device.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: Password changed, new tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: Wrong, expired or locked code, or weak password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/2fa/verify:
    post:
      tags: [auth]
      summary: Second step of a login with 2FA
      description: >-
        code is the 6-digit code of the authenticator app (each code works once) or a recovery code (XXXXX-XXXXX,
        single use); with email 2FA, the 6-digit code from the email (valid 15 minutes, single use).
        5 wrong codes in a row block 2FA codes for 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorLoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: Wrong code (invalid_two_factor_code)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Challenge expired (5 minutes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Too many wrong codes (two_factor_locked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/2fa/setup:
    post:
      tags: [auth]
      summary: Start 2FA setup (new TOTP secret, not active yet)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Secret and otpauth:// link (to show as a QR code)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSetupResponse" }
        "409":
          description: 2FA already on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/2fa/enable:
    post:
      tags: [auth]
      summary: Turn 2FA on with a first code; returns 10 recovery codes (shown once) and emails an alert
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorCodeRequest" }
      responses:
        "200":
          description: 2FA on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodesResponse" }
        "400":
          description: Wrong code, or setup not started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/2fa/disable:
    post:
      tags: [auth]
      summary: Turn 2FA off, whatever the method (needs a code, a recovery code or an emailed code) and email an alert
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorCodeRequest" }
      responses:
        "200":
          description: 2FA off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400":
          description: Wrong code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/2fa/email/code:
    post:
      tags: [auth]
      summary: Email a code to turn email 2FA on (2FA off) or off (email 2FA on)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Code sent
        "409":
          description: 2FA with an authenticator app is on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: A code was sent less than a minute ago
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The email could not be sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/2fa/email/enable:
    post:
      tags: [auth]
      summary: Turn email 2FA on with the emailed code, and email an alert. Off by default.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorCodeRequest" }
      responses:
        "200":
          description: Email 2FA on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400":
          description: Wrong or expired code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: 2FA already on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/2fa/email/resend:
    post:
      tags: [auth]
      summary: During a login with email 2FA, email a new code (the previous one stops working)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorResendRequest" }
      responses:
        "204":
          description: Code sent
        "401":
          description: Challenge expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: A code was sent less than a minute ago
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/users/me/social-links:
    put:
      tags: [users]
      summary: Replace the social networks shown on the profile
      description: >-
        One username per network. "@name" and profile links are accepted and cleaned ("https://instagram.com/name" -> "name").
        An empty username removes the network.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSocialLinksRequest" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400":
          description: A username does not match the network's format (social_handle_invalid)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/users/me/avatar:
    put:
      tags: [users]
      summary: Upload a profile photo (JPEG or PNG, 5 MB max)
      description: The server checks it is an image, crops it to a square and stores a 256x256 JPEG (metadata removed).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Updated profile (new avatarVersion)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400":
          description: Not an image (invalid_image) or too large (image_too_large)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [users]
      summary: Remove the profile photo (the initials avatar is shown again)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated profile (avatarVersion null)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
  /api/v1/users/{id}/avatar:
    get:
      tags: [users]
      summary: Profile photo of a user (256x256 JPEG)
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The photo
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404":
          description: No photo
  /api/v1/users/me:
    get:
      tags: [users]
      summary: Authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      tags: [users]
      summary: Update the authenticated user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400":
          description: Invalid display name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Another account already has this display name, whatever the case (display_name_taken)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/events:
    get:
      tags: [events]
      summary: List events
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [public, nearby, invited, mine], default: public } }
        - { in: query, name: lat, schema: { type: number }, description: Needed for nearby }
        - { in: query, name: lng, schema: { type: number }, description: Needed for nearby }
      responses:
        "200":
          description: Events, playing ones first (public), or the closest first (nearby, within 50 km)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventsResponse" }
        "400":
          description: event_location_required (nearby without a position)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [events]
      summary: Create an event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEventRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetailResponse" }
        "400":
          description: Invalid settings (event_name_required, event_area_required, event_hours_invalid...)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/events/{id}:
    get:
      tags: [events]
      summary: Event page (song playing, next one, queue by votes, people invited)
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The event as the user sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetailResponse" }
        "404":
          description: No such event, or a private one the user was not invited to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [events]
      summary: Change the settings (owner)
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEventRequest" }
      responses:
        "200":
          description: The event as the user sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetailResponse" }
        "400":
          description: Invalid settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Only the owner can do this
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such event, or a private one the user was not invited to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [events]
      summary: Delete the event (owner); followers get a "deleted" message
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "403":
          description: Only the owner can do this
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such event, or a private one the user was not invited to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/events/{id}/tracks:
    post:
      tags: [events]
      summary: Propose a Spotify track, with the proposer's vote
      description: >-
        The track details are read from Spotify (the app token when the user has no Spotify account). A song already
        waiting counts as a vote for it. At most 5 waiting songs per person (the owner has no limit).
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposeTrackRequest" }
      responses:
        "200":
          description: The event as the user sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetailResponse" }
        "400":
          description: "event_location_required (the location license needs the user's position)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: event_vote_not_allowed (invited only), event_out_of_area, event_closed (outside the hours)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: event_proposal_limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such event, or a private one the user was not invited to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/events/{id}/tracks/{trackId}:
    delete:
      tags: [events]
      summary: Remove a queued song (the owner any, the others their own)
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: trackId, required: true, schema: { type: string, format: uuid }, description: Id of the song in the event (EventTrackResponse.id) }
      responses:
        "200":
          description: The event as the user sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetailResponse" }
        "403":
          description: Not the owner nor the proposer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The song already plays
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such event, or a private one the user was not invited to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/events/{id}/tracks/{trackId}/vote:
    post:
      tags: [events]
      summary: Vote for a queued song
      description: >-
        One vote per user and song (primary key of event_votes); the count changes in the same transaction with
        votes = votes + 1, after locking the song's row. Voting again changes nothing.
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: trackId, required: true, schema: { type: string, format: uuid }, description: Id of the song in the event (EventTrackResponse.id) }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventVoteRequest" }
      responses:
        "200":
          description: The event as the user sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetailResponse" }
        "400":
          description: "event_location_required (the location license needs the user's position)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: event_vote_not_allowed (invited only), event_out_of_area, event_closed (outside the hours)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such event, or a private one the user was not invited to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [events]
      summary: Take the vote back
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: trackId, required: true, schema: { type: string, format: uuid }, description: Id of the song in the event (EventTrackResponse.id) }
      responses:
        "200":
          description: The event as the user sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetailResponse" }
        "404":
          description: No such event, or a private one the user was not invited to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/events/{id}/invited/{userId}:
    post:
      tags: [events]
      summary: Invite a friend (owner); they get a notification
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The event as the user sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetailResponse" }
        "403":
          description: Not the owner, or not a friend (not_friends)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such event, or a private one the user was not invited to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [events]
      summary: Take an invitation back (owner), or leave (the person invited)
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Done
        "404":
          description: No such event, or a private one the user was not invited to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/events/{id}/play:
    post:
      tags: [events]
      summary: Start the music on the owner's Spotify, or resume it (owner)
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The event as the user sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetailResponse" }
        "403":
          description: Only the owner can do this
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: spotify_not_connected, spotify_no_device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such event, or a private one the user was not invited to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/events/{id}/pause:
    post:
      tags: [events]
      summary: Pause the music (owner)
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The event as the user sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetailResponse" }
        "403":
          description: Only the owner can do this
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such event, or a private one the user was not invited to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/events/{id}/skip:
    post:
      tags: [events]
      summary: Play the most voted song now (owner)
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The event as the user sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetailResponse" }
        "403":
          description: Only the owner can do this
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: spotify_not_connected, spotify_no_device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such event, or a private one the user was not invited to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/events/{id}/stop:
    post:
      tags: [events]
      summary: "Stop the music, the next song goes back to the vote (owner)"
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The event as the user sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetailResponse" }
        "403":
          description: Only the owner can do this
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such event, or a private one the user was not invited to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/events/{id}/ws:
    get:
      tags: [events]
      summary: WebSocket of the event's state
      description: >-
        The access token goes in the "token" query parameter. The server sends EventLiveEvent messages:
        {"type":"state","detail":EventDetailResponse} on joining and after each change (changes close together are
        sent once), {"type":"deleted"} when the owner deletes the event. The socket closes with code 1008 when the
        token is invalid or the event is not visible.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: token, required: true, schema: { type: string } }
      responses:
        "101":
          description: Switching to the WebSocket protocol
  /api/v1/users/search:
    get:
      tags: [social]
      summary: Find users by name (any case); the exact name first
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: q, required: true, schema: { type: string } }
      responses:
        "200":
          description: Users with how they relate to the user (friendship)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsersResponse" }
  /api/v1/friends:
    get:
      tags: [social]
      summary: Friends, requests received and requests sent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendsResponse" }
  /api/v1/friends/{userId}:
    post:
      tags: [social]
      summary: Ask to be friends, or accept their request
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The user with the new friendship status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicUserResponse" }
    delete:
      tags: [social]
      summary: Remove a friend, take back or decline a request
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Done
  /api/v1/conversations/{userId}/messages:
    get:
      tags: [social]
      summary: A page of the chat with a friend (40 messages, oldest first)
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: before, schema: { type: integer, format: int64 }, description: "Older than this date (epoch ms)" }
      responses:
        "200":
          description: OK
        "403":
          description: Not friends (not_friends)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [social]
      summary: Send a message to a friend
      security:
        - bearerAuth: []
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: Sent
        "403":
          description: Not friends (not_friends)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/notifications:
    get:
      tags: [social]
      summary: Latest 50 notifications (friend_request, friend_accepted, playlist_invite, event_invite)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/v1/social/ws:
    get:
      tags: [social]
      summary: WebSocket of live social events (messages, typing, read receipts, notifications, counts)
      parameters:
        - { in: query, name: token, required: true, schema: { type: string } }
      responses:
        "101":
          description: Switching to the WebSocket protocol
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XPlatform:
      in: header
      name: X-Platform
      schema: { type: string, example: android }
    XDevice:
      in: header
      name: X-Device
      schema: { type: string, example: Pixel 8 }
    XAppVersion:
      in: header
      name: X-App-Version
      schema: { type: string, example: 0.1.0 }
  schemas:
    HealthResponse:
      type: object
      required: [status, database]
      properties:
        status: { type: string, example: ok }
        database: { type: string, example: up }
    InfoResponse:
      type: object
      required: [name, version]
      properties:
        name: { type: string, example: music-room }
        version: { type: string, example: 0.1.0 }
    UserResponse:
      type: object
      required: [id, email, displayName, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        emailVerified: { type: boolean }
        twoFactorEnabled: { type: boolean }
        twoFactorMethod: { type: string, enum: [app, email], nullable: true, description: "Null when 2FA is off" }
        avatarColor: { type: string, enum: [yellow, tomato, pink, iris, teal, grass] }
        avatarVersion: { type: integer, nullable: true, description: "Changes with each new photo; null without photo" }
        socialLinks: { type: array, items: { $ref: "#/components/schemas/SocialLink" } }
    SocialLink:
      type: object
      required: [network, handle]
      properties:
        network: { type: string, enum: [instagram, tiktok, x, youtube, twitch, discord, spotify, soundcloud] }
        handle: { type: string, example: swann.music }
    UpdateSocialLinksRequest:
      type: object
      required: [links]
      properties:
        links: { type: array, items: { $ref: "#/components/schemas/SocialLink" } }
    TwoFactorChallengeResponse:
      type: object
      required: [challengeToken, expiresInSeconds]
      properties:
        challengeToken: { type: string }
        expiresInSeconds: { type: integer, example: 300 }
        method: { type: string, enum: [app, email], description: "email: the code was just emailed" }
    TwoFactorResendRequest:
      type: object
      required: [challengeToken]
      properties:
        challengeToken: { type: string }
    TwoFactorLoginRequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken: { type: string }
        code: { type: string, example: "123456" }
    TwoFactorSetupResponse:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: Base32 }
        otpauthUri: { type: string, example: "otpauth://totp/Music%20Room:alice@example.com?secret=...&issuer=Music%20Room" }
    TwoFactorCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    RecoveryCodesResponse:
      type: object
      required: [recoveryCodes, user]
      properties:
        recoveryCodes: { type: array, items: { type: string, example: "N677E-8X6SG" } }
        user: { $ref: "#/components/schemas/UserResponse" }
    RegisterRequest:
      type: object
      required: [email, password, displayName, acceptedTerms]
      properties:
        email: { type: string, format: email, example: alice@example.com }
        password: { type: string, format: password, minLength: 8, description: "8+ characters, at least one letter and one digit, max 72 bytes" }
        displayName: { type: string, maxLength: 64, example: Alice }
        acceptedTerms: { type: boolean, example: true, description: "Must be true" }
    OAuthLoginRequest:
      type: object
      required: [provider, idToken]
      properties:
        provider: { type: string, enum: [google, apple] }
        idToken: { type: string, description: "ID token (JWT) returned by the provider's SDK" }
        acceptedTerms: { type: boolean, default: false, description: "Required to create a new account" }
        displayName: { type: string, maxLength: 64, description: "Optional, used for a new account (Apple does not put the name in the token)" }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: "^[0-9]{6}$" }
        newPassword: { type: string, format: password }
    VerifyEmailRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$", example: "042917" }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password }
    UpdateProfileRequest:
      type: object
      description: Fields left out are not changed.
      properties:
        displayName: { type: string, maxLength: 64 }
        avatarColor: { type: string, enum: [yellow, tomato, pink, iris, teal, grass] }
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds, user]
      properties:
        accessToken: { type: string, description: "JWT, send it as 'Authorization: Bearer <token>'" }
        refreshToken: { type: string, description: "Opaque token, single use" }
        expiresInSeconds: { type: integer, example: 900 }
        user: { $ref: "#/components/schemas/UserResponse" }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: >-
            Machine-readable code the app translates, e.g. invalid_credentials, email_taken, invalid_code,
            code_expired, too_many_attempts, wrong_current_password, password_too_short (see ApiErrors and
            ValidationError in the shared module).
        message: { type: string }
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, example: 48.8566 }
        longitude: { type: number, example: 2.3522 }
    PublicUserResponse:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarColor: { type: string }
        avatarVersion: { type: integer, format: int64, nullable: true }
        friendship: { type: string, enum: [NONE, FRIENDS, REQUEST_SENT, REQUEST_RECEIVED, SELF] }
    UsersResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PublicUserResponse" } }
    FriendsResponse:
      type: object
      properties:
        friends: { type: array, items: { $ref: "#/components/schemas/PublicUserResponse" } }
        received: { type: array, items: { $ref: "#/components/schemas/PublicUserResponse" } }
        sent: { type: array, items: { $ref: "#/components/schemas/PublicUserResponse" } }
    TrackResponse:
      type: object
      required: [id, name, artists, album, durationMs, uri]
      properties:
        id: { type: string }
        name: { type: string }
        artists: { type: array, items: { type: string } }
        album: { type: string }
        imageUrl: { type: string, nullable: true }
        durationMs: { type: integer, format: int64 }
        uri: { type: string, example: "spotify:track:4uLU6hMCjMI75M1A2tKUQC" }
    CreateEventRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 280 }
        visibility: { type: string, enum: [PUBLIC, PRIVATE], default: PUBLIC }
        voteLicense:
          type: string
          enum: [EVERYONE, INVITED, LOCATION]
          default: EVERYONE
          description: LOCATION needs location and radiusMeters (50 to 50000); startsAt/endsAt limit the hours.
        location: { $ref: "#/components/schemas/GeoPoint" }
        radiusMeters: { type: integer }
        startsAt: { type: integer, format: int64, description: epoch ms }
        endsAt: { type: integer, format: int64, description: epoch ms }
    ProposeTrackRequest:
      type: object
      required: [trackId]
      properties:
        trackId: { type: string, description: Spotify track id }
        location: { $ref: "#/components/schemas/GeoPoint" }
    EventVoteRequest:
      type: object
      properties:
        location: { $ref: "#/components/schemas/GeoPoint" }
    EventResponse:
      type: object
      required: [id, name, visibility, voteLicense, status, owner, isOwner, isInvited, canVote]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [PUBLIC, PRIVATE] }
        voteLicense: { type: string, enum: [EVERYONE, INVITED, LOCATION] }
        status: { type: string, enum: [WAITING, PLAYING, PAUSED] }
        owner: { $ref: "#/components/schemas/PublicUserResponse" }
        isOwner: { type: boolean }
        isInvited: { type: boolean }
        canVote: { type: boolean, description: "With LOCATION, true during the hours: the position is checked on each vote" }
        location: { $ref: "#/components/schemas/GeoPoint" }
        radiusMeters: { type: integer, nullable: true }
        startsAt: { type: integer, format: int64, nullable: true }
        endsAt: { type: integer, format: int64, nullable: true }
        queuedCount: { type: integer }
        listeners: { type: integer, description: People following the event right now }
        nowPlaying: { $ref: "#/components/schemas/TrackResponse" }
    EventsResponse:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EventResponse" } }
    EventTrackResponse:
      type: object
      required: [id, track, votes]
      properties:
        id: { type: string, format: uuid }
        track: { $ref: "#/components/schemas/TrackResponse" }
        proposedBy: { $ref: "#/components/schemas/PublicUserResponse" }
        votes: { type: integer }
        voted: { type: boolean, description: The user voted for it }
        status: { type: string, enum: [QUEUED, NEXT, PLAYING] }
    EventDetailResponse:
      type: object
      required: [event]
      properties:
        event: { $ref: "#/components/schemas/EventResponse" }
        nowPlaying: { $ref: "#/components/schemas/EventTrackResponse" }
        next: { $ref: "#/components/schemas/EventTrackResponse" }
        queue:
          type: array
          description: Queued songs, most voted first, then the oldest
          items: { $ref: "#/components/schemas/EventTrackResponse" }
        invited: { type: array, items: { $ref: "#/components/schemas/PublicUserResponse" } }
        playbackIssue: { type: string, nullable: true, description: "Owner only: why the music cannot play (e.g. spotify_no_device)" }
        progressMs: { type: integer, format: int64 }
        sentAt: { type: integer, format: int64 }
