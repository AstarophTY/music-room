ktor:
  deployment:
    port: "$SERVER_PORT:8080"
  application:
    modules:
      - com.musicroom.server.ApplicationKt.module

app:
  version: "0.1.0"

database:
  url: "$DB_URL:jdbc:postgresql://localhost:5432/musicroom"
  user: "$POSTGRES_USER:musicroom"
  password: "$POSTGRES_PASSWORD"
  maxPoolSize: "$DB_MAX_POOL_SIZE:10"

jwt:
  secret: "$JWT_SECRET"
  issuer: "$JWT_ISSUER:music-room"
  audience: "$JWT_AUDIENCE:music-room-app"
  realm: "music-room"
  accessTokenTtlMinutes: "$JWT_ACCESS_TTL_MINUTES:15"
  refreshTokenTtlDays: "$JWT_REFRESH_TTL_DAYS:30"

# Leave GOOGLE_CLIENT_ID / APPLE_CLIENT_ID empty to turn that sign-in method off.
# Several IDs can be given, separated by commas.
oauth:
  googleClientIds: "$GOOGLE_CLIENT_ID:"
  appleClientIds: "$APPLE_CLIENT_ID:"

# Spotify app from https://developer.spotify.com/dashboard. The redirect URI must be registered there exactly.
spotify:
  clientId: "$SPOTIFY_CLIENT_ID:"
  clientSecret: "$SPOTIFY_CLIENT_SECRET:"
  redirectUri: "$SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/api/v1/spotify/callback"

# Music Room Premium, sold with Stripe (https://dashboard.stripe.com/apikeys). Leave STRIPE_SECRET_KEY empty to turn it off.
# STRIPE_PRICE_ID: the monthly price of the Premium product. Webhook endpoint: <server>/api/v1/billing/webhook
stripe:
  secretKey: "$STRIPE_SECRET_KEY:"
  webhookSecret: "$STRIPE_WEBHOOK_SECRET:"
  priceId: "$STRIPE_PRICE_ID:"
  returnUrl: "$STRIPE_RETURN_URL:http://127.0.0.1:8080/api/v1/billing/return"
  # true: Stripe Tax adds the VAT at checkout (turn on Stripe Tax and add a registration first).
  automaticTax: "$STRIPE_AUTOMATIC_TAX:false"

# SMTP_HOST empty: emails are not sent, they are written to the server logs (make logs).
mail:
  host: "$SMTP_HOST:"
  port: "$SMTP_PORT:587"
  user: "$SMTP_USER:"
  password: "$SMTP_PASSWORD:"
  from: "$SMTP_FROM:Music Room <no-reply@musicroom.local>"
