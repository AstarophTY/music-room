apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: music-room
  namespace: music-room
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`music-room.example.com`) && (PathRegexp(`^/api/v1/users/[^/]+/tracks$`))
      priority: 300
      services:
        - name: library
          port: 8080
    - kind: Rule
      match: Host(`music-room.example.com`) && (PathPrefix(`/api/v1/auth/`))
      priority: 200
      middlewares:
        - name: auth-rate-limit
      services:
        - name: identity
          port: 8080
    - kind: Rule
      match: Host(`music-room.example.com`) && (Path(`/api/v1/users/me`) || PathPrefix(`/api/v1/users/me/`) || PathRegexp(`^/api/v1/users/[^/]+/avatar$`))
      priority: 200
      services:
        - name: identity
          port: 8080
    - kind: Rule
      match: Host(`music-room.example.com`) && (Path(`/health`) || Path(`/api/v1/info`) || Path(`/swagger`) || PathPrefix(`/swagger/`))
      priority: 200
      services:
        - name: identity
          port: 8080
    - kind: Rule
      match: Host(`music-room.example.com`) && (PathPrefix(`/api/v1/spotify`) || PathPrefix(`/api/v1/music/`) || PathPrefix(`/api/v1/apple-music/`))
      priority: 200
      services:
        - name: music
          port: 8080
    - kind: Rule
      match: Host(`music-room.example.com`) && (Path(`/api/v1/playlists`) || PathPrefix(`/api/v1/playlists/`) || Path(`/api/v1/billing`) || PathPrefix(`/api/v1/billing/`) || Path(`/api/v1/tracks`) || PathPrefix(`/api/v1/tracks/`))
      priority: 200
      services:
        - name: library
          port: 8080
    - kind: Rule
      match: Host(`music-room.example.com`) && (Path(`/api/v1/events`) || PathPrefix(`/api/v1/events/`) || Path(`/api/v1/friends`) || PathPrefix(`/api/v1/friends/`) || Path(`/api/v1/conversations`) || PathPrefix(`/api/v1/conversations/`) || Path(`/api/v1/notifications`) || PathPrefix(`/api/v1/notifications/`) || PathPrefix(`/api/v1/social/`))
      priority: 200
      services:
        - name: realtime
          port: 8080
    - kind: Rule
      match: Host(`music-room.example.com`) && (PathPrefix(`/api/v1/users/`))
      priority: 100
      services:
        - name: realtime
          port: 8080
  tls:
    secretName: music-room-tls
