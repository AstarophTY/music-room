apiVersion: v1
kind: ConfigMap
metadata:
  name: music-room-config
data:
  SERVER_PORT: "8080"
  POSTGRES_DB: musicroom
  DB_URL: jdbc:postgresql://postgres:5432/musicroom
  JWT_ISSUER: music-room
  JWT_AUDIENCE: music-room-app
  JWT_ACCESS_TTL_MINUTES: "15"
  JWT_REFRESH_TTL_DAYS: "30"
  # Only Traefik can reach the pods (network-policies.yaml), so its X-Real-Ip header can be trusted.
  TRUST_PROXY: "true"
  JAVA_OPTS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
